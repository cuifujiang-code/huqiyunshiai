# 腾讯云：/etc/nginx/sites-available/teacher-api
# 安装：sudo cp 本文件 /etc/nginx/sites-available/teacher-api
#       sudo ln -sf /etc/nginx/sites-available/teacher-api /etc/nginx/sites-enabled/teacher-api
#       sudo nginx -t && sudo systemctl reload nginx
#
# 证书路径按 certbot 实际输出修改（常见如下）
#   ssl_certificate     /etc/letsencrypt/live/api.huqiyunshiai.online/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/api.huqiyunshiai.online/privkey.pem;

server {
    listen 80;
    server_name api.huqiyunshiai.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.huqiyunshiai.online;

    ssl_certificate     /etc/letsencrypt/live/api.huqiyunshiai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.huqiyunshiai.online/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
