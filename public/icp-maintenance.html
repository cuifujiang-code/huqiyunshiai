<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>网站备案中 - 华祺云师AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f0f4ff 0%, #e8eef8 100%);
      color: #1e293b;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 1rem; line-height: 1.7; color: #64748b; margin-bottom: 8px; }
    .domain { margin-top: 24px; font-size: 0.875rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">🔒</div>
    <h1>网站备案中</h1>
    <p>本网站正在办理 ICP 备案，暂停对外服务。</p>
    <p>备案完成后将恢复正常访问，感谢您的理解。</p>
    <p class="domain">huqiyunshiai.online</p>
  </div>
</body>
</html>
